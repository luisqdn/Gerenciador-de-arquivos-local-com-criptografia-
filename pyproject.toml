[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arca"
version = "1.0.0"
description = "Gerenciador de senhas local com cofre criptografado de formato proprio"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Fabiano Leite Freitas" }]
keywords = ["senhas", "criptografia", "argon2", "cofre"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "cryptography>=42.0",
    "argon2-cffi>=23.1",
    "PySide6>=6.6",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.gui-scripts]
arca = "arca.controller.app_controller:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arca = ["view/*.qss", "resources/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# As assinaturas dos modelos Qt sao ditadas pela classe base: o valor padrao
# QModelIndex() faz parte do contrato de QAbstractItemModel e trocar por None
# quebraria as chamadas vindas do lado C++.
"src/arca/view/adapters.py" = ["B008"]
